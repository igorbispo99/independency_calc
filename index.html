<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Independência Financeira</title>
  
  <!-- Carregando React e ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Carregando Babel para compilar JSX no navegador -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Carregando Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Remove setinhas dos inputs numéricos */
    input[type=number]::-webkit-outer-spin-button,
    input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; appearance: textfield; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect, useCallback } = React;

    // Ícones SVG inline para não depender de pacotes externos
    const Target = ({ className }) => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>
      </svg>
    );

    const Clock = ({ className }) => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
      </svg>
    );

    const TrendingUp = ({ className }) => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>
      </svg>
    );

    const Info = ({ className }) => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>
      </svg>
    );

    const Refresh = ({ className }) => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
      </svg>
    );

    const Wifi = ({ className }) => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <path d="M5 12.55a11 11 0 0114 0"/><path d="M1.42 9a16 16 0 0121.16 0"/><path d="M8.53 16.11a6 6 0 016.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/>
      </svg>
    );

    const WifiOff = ({ className }) => (
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <line x1="1" y1="1" x2="23" y2="23"/><path d="M16.72 11.06A10.94 10.94 0 0119 12.55"/><path d="M5 12.55a10.94 10.94 0 015.17-2.39"/><path d="M10.71 5.05A16 16 0 0122.56 9"/><path d="M1.42 9a15.91 15.91 0 014.7-2.88"/><path d="M8.53 16.11a6 6 0 016.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/>
      </svg>
    );

    // --- Serviço de dados do Banco Central do Brasil ---
    const BCB_API_BASE = 'https://api.bcb.gov.br/dados/serie/bcdata.sgs';

    // Séries do SGS (Sistema Gerenciador de Séries Temporais):
    // 432  = Taxa SELIC Meta (% a.a.) — proxy fiel do CDI
    // 433  = IPCA variação mensal (%)
    const SERIES = {
      SELIC_META: 432,
      IPCA_MENSAL: 433,
    };

    async function fetchBCBSeries(seriesId, lastN = 1) {
      const url = `${BCB_API_BASE}.${seriesId}/dados/ultimos/${lastN}?formato=json`;
      const response = await fetch(url);
      if (!response.ok) throw new Error(`BCB API error: ${response.status}`);
      return response.json();
    }

    function parseDecimalBR(str) {
      return parseFloat(str.replace(',', '.'));
    }

    function parseDateBR(str) {
      const [dd, mm, yyyy] = str.split('/');
      return new Date(yyyy, mm - 1, dd);
    }

    async function fetchLiveRates() {
      // Busca SELIC Meta (1 valor mais recente) e IPCA mensal (últimos 12 meses)
      const [selicData, ipcaData] = await Promise.all([
        fetchBCBSeries(SERIES.SELIC_META, 1),
        fetchBCBSeries(SERIES.IPCA_MENSAL, 12),
      ]);

      // SELIC Meta já vem como taxa anual
      const selicMeta = parseDecimalBR(selicData[0].valor);
      const selicDate = parseDateBR(selicData[0].data);

      // IPCA: acumular os últimos 12 meses via produto composto
      const ipca12m = ipcaData.reduce((acc, item) => {
        return acc * (1 + parseDecimalBR(item.valor) / 100);
      }, 1);
      const ipcaAcumulado = (ipca12m - 1) * 100;
      const ipcaDate = parseDateBR(ipcaData[ipcaData.length - 1].data);

      return {
        cdi: Math.round(selicMeta * 100) / 100,
        cdiDate: selicDate,
        ipca: Math.round(ipcaAcumulado * 100) / 100,
        ipcaDate: ipcaDate,
      };
    }

    function App() {
      // Estados para os parâmetros
      const [activeIncome, setActiveIncome] = useState(10000);
      const [initialPatrimony, setInitialPatrimony] = useState(0);
      const [savingsRate, setSavingsRate] = useState(20);
      const [cdiRate, setCdiRate] = useState(10.5);
      const [inflationRate, setInflationRate] = useState(4.5);

      // Estados para dados ao vivo do BCB
      const [liveData, setLiveData] = useState(null);       // { cdi, cdiDate, ipca, ipcaDate }
      const [dataStatus, setDataStatus] = useState('loading'); // 'loading' | 'live' | 'offline'
      const [isManualCdi, setIsManualCdi] = useState(false);
      const [isManualIpca, setIsManualIpca] = useState(false);
      const [hoverInfo, setHoverInfo] = useState(null);
      const [pinnedScenario, setPinnedScenario] = useState(null);
      const chartContainerRef = React.useRef(null);
      const [chartContainerWidth, setChartContainerWidth] = React.useState(800);

      React.useEffect(() => {
        const el = chartContainerRef.current;
        if (!el) return;
        const ro = new ResizeObserver(([entry]) => setChartContainerWidth(Math.floor(entry.contentRect.width)));
        ro.observe(el);
        return () => ro.disconnect();
      }, []);

      const loadLiveData = useCallback(async () => {
        setDataStatus('loading');
        try {
          const data = await fetchLiveRates();
          setLiveData(data);
          setDataStatus('live');
          if (!isManualCdi) setCdiRate(data.cdi);
          if (!isManualIpca) setInflationRate(data.ipca);
        } catch (err) {
          console.error('Erro ao buscar dados do BCB:', err);
          setDataStatus('offline');
        }
      }, [isManualCdi, isManualIpca]);

      useEffect(() => {
        loadLiveData();
      }, []);

      const handleCdiChange = (value) => {
        setCdiRate(value);
        setIsManualCdi(true);
      };

      const handleInflationChange = (value) => {
        setInflationRate(value);
        setIsManualIpca(true);
      };

      const resetToLive = (field) => {
        if (!liveData) return;
        if (field === 'cdi') {
          setCdiRate(liveData.cdi);
          setIsManualCdi(false);
        } else {
          setInflationRate(liveData.ipca);
          setIsManualIpca(false);
        }
      };

      const formatDate = (date) => {
        if (!date) return '';
        return date.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
      };

      // Cálculos principais
      const results = useMemo(() => {
        if (savingsRate <= 0 || cdiRate <= 0 || activeIncome <= 0) {
          return { months: 0, data: [], maxMonths: 0, isPossible: false, error: "Insira valores válidos maiores que zero." };
        }

        const realAnnualRate = (1 + cdiRate / 100) / (1 + inflationRate / 100) - 1;
        
        if (realAnnualRate <= 0) {
           return { months: 0, data: [], maxMonths: 0, isPossible: false, error: "A inflação está maior ou igual ao CDI." };
        }

        const realMonthlyRate = Math.pow(1 + realAnnualRate, 1 / 12) - 1;
        const monthlySavings = activeIncome * (savingsRate / 100);

        let currentMonths = 0;
        let patrimony = Math.max(0, initialPatrimony);
        let passiveIncome = patrimony * realMonthlyRate;
        const dataPoints = [];

        const MAX_MONTHS = 1800;

        dataPoints.push({ month: 0, passiveIncome, patrimony });

        while (passiveIncome < activeIncome && currentMonths < MAX_MONTHS) {
          currentMonths++;
          patrimony += monthlySavings;
          patrimony *= (1 + realMonthlyRate);
          passiveIncome = patrimony * realMonthlyRate;

          if (currentMonths % 6 === 0 || passiveIncome >= activeIncome) {
            dataPoints.push({
              month: currentMonths,
              passiveIncome: passiveIncome,
              patrimony: patrimony
            });
          }
        }

        const extraMonths = Math.floor(currentMonths * 0.15);
        for (let i = 1; i <= extraMonths; i++) {
          patrimony += monthlySavings;
          patrimony *= (1 + realMonthlyRate);
          const futurePassiveIncome = patrimony * realMonthlyRate;
          if (i % 6 === 0 || i === extraMonths) {
            dataPoints.push({
              month: currentMonths + i,
              passiveIncome: futurePassiveIncome,
              patrimony: patrimony
            });
          }
        }

        return {
          months: currentMonths,
          years: Math.floor(currentMonths / 12),
          remainingMonths: currentMonths % 12,
          data: dataPoints,
          maxMonths: currentMonths + extraMonths,
          finalPatrimony: patrimony,
          isPossible: currentMonths < MAX_MONTHS,
          realAnnualRate: realAnnualRate * 100,
        };
      }, [activeIncome, initialPatrimony, savingsRate, cdiRate, inflationRate]);

      const formatCurrency = (value) => {
        return new Intl.NumberFormat('pt-BR', {
          style: 'currency',
          currency: 'BRL',
          maximumFractionDigits: 0,
        }).format(value);
      };

      const formatCurrencyCompact = (value) => {
        if (value >= 1_000_000_000) {
          return `R$ ${(value / 1_000_000_000).toLocaleString('pt-BR', { maximumFractionDigits: 2 })} Bi`;
        }
        if (value >= 1_000_000) {
          return `R$ ${(value / 1_000_000).toLocaleString('pt-BR', { maximumFractionDigits: 2 })} M`;
        }
        return formatCurrency(value);
      };

      const renderChart = () => {
        if (!results.isPossible || results.data.length === 0) return null;

        const width = chartContainerWidth || 800;
        const isMobile = width < 480;
        const height = isMobile ? 220 : 300;
        const padding = { top: 20, right: isMobile ? 12 : 20, bottom: 36, left: isMobile ? 56 : 80 };
        const fontSize = isMobile ? 10 : 12;
        const fontSizeSm = isMobile ? 9 : 10;

        const chartWidth = width - padding.left - padding.right;
        const chartHeight = height - padding.top - padding.bottom;

        const maxX = Math.max(results.maxMonths, pinnedScenario?.maxMonths || 0, 1);
        const maxY = Math.max(activeIncome * 1.3, 1);

        const getX = (month) => padding.left + (month / maxX) * chartWidth;
        const getY = (val) => padding.top + chartHeight - (val / maxY) * chartHeight;

        const passivePath = results.data.map((d, i) => {
          return `${i === 0 ? 'M' : 'L'} ${getX(d.month)} ${getY(d.passiveIncome)}`;
        }).join(' ');

        const areaPath = `${passivePath} L ${getX(results.data[results.data.length - 1].month)} ${getY(0)} L ${getX(0)} ${getY(0)} Z`;

        const crossoverX = getX(results.months);
        const activeIncomeY = getY(activeIncome);

        const maxYears = Math.ceil(maxX / 12);
        const maxLabels = isMobile ? 4 : 8;
        const labelStep = Math.max(1, Math.ceil(maxYears / maxLabels));

        const pinnedPath = pinnedScenario && pinnedScenario.data.length > 0
          ? pinnedScenario.data.map((d, i) => `${i === 0 ? 'M' : 'L'} ${getX(d.month)} ${getY(d.passiveIncome)}`).join(' ')
          : null;

        const handleMouseMove = (e) => {
          const svgEl = e.currentTarget;
          const rect = svgEl.getBoundingClientRect();
          const scaleX = width / rect.width;
          const mouseXsvg = (e.clientX - rect.left) * scaleX;
          const mouseMonth = ((mouseXsvg - padding.left) / chartWidth) * maxX;

          if (mouseMonth < 0 || mouseMonth > maxX) { setHoverInfo(null); return; }

          const data = results.data;
          let idx = data.findIndex(d => d.month >= mouseMonth);
          let passiveIncome, patrimony;
          if (idx <= 0) {
            passiveIncome = data[0].passiveIncome || 0;
            patrimony = data[0].patrimony || 0;
          } else if (idx >= data.length) {
            passiveIncome = data[data.length - 1].passiveIncome;
            patrimony = data[data.length - 1].patrimony || 0;
          } else {
            const prev = data[idx - 1], next = data[idx];
            const t = (mouseMonth - prev.month) / (next.month - prev.month);
            passiveIncome = prev.passiveIncome + t * (next.passiveIncome - prev.passiveIncome);
            patrimony = (prev.patrimony || 0) + t * ((next.patrimony || 0) - (prev.patrimony || 0));
          }

          setHoverInfo({ month: Math.round(mouseMonth), passiveIncome, patrimony, svgX: getX(mouseMonth), svgY: getY(passiveIncome) });
        };

        return (
          <div className="w-full">
            <svg
              width={width}
              height={height}
              className="cursor-crosshair block"
              onMouseMove={handleMouseMove}
              onMouseLeave={() => setHoverInfo(null)}
            >
              <line x1={padding.left} y1={padding.top + chartHeight} x2={width - padding.right} y2={padding.top + chartHeight} stroke="#94a3b8" strokeWidth="1" />
              <line x1={padding.left} y1={padding.top} x2={padding.left} y2={padding.top + chartHeight} stroke="#94a3b8" strokeWidth="1" />

              {[0, 0.25, 0.5, 0.75, 1, 1.3].map((factor) => {
                const yVal = activeIncome * factor;
                const yPos = getY(yVal);
                const isMain = [0, 0.5, 1, 1.3].includes(factor);
                const isMid = [0.25, 0.75].includes(factor);
                return (
                  <g key={factor}>
                    <line x1={padding.left} y1={yPos} x2={width - padding.right} y2={yPos} stroke={isMid ? "#cbd5e1" : "#e2e8f0"} strokeDasharray={isMid ? "3,5" : "4,4"} />
                    {isMain && (
                      <text x={padding.left - 6} y={yPos + 4} textAnchor="end" fontSize={fontSize} fill="#64748b">
                        {isMobile ? formatCurrencyCompact(yVal) : formatCurrency(yVal)}
                      </text>
                    )}
                    {isMid && !isMobile && (
                      <text x={padding.left - 6} y={yPos + 4} textAnchor="end" fontSize={fontSizeSm} fill="#94a3b8">
                        {Math.round(factor * 100)}%
                      </text>
                    )}
                  </g>
                );
              })}

              {Array.from({ length: maxYears + 1 }).map((_, i) => {
                if (i % labelStep !== 0) return null;
                const xPos = getX(i * 12);
                return (
                  <g key={i}>
                    <line x1={xPos} y1={padding.top + chartHeight} x2={xPos} y2={padding.top + chartHeight + 4} stroke="#94a3b8" />
                    <text x={xPos} y={padding.top + chartHeight + 16} textAnchor="middle" fontSize={fontSize} fill="#64748b">
                      {isMobile ? `${i}a` : `Ano ${i}`}
                    </text>
                  </g>
                );
              })}

              <defs>
                <linearGradient id="passiveGradient" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stopColor="#10b981" stopOpacity="0.3" />
                  <stop offset="100%" stopColor="#10b981" stopOpacity="0.0" />
                </linearGradient>
              </defs>

              {pinnedPath && (
                <path d={pinnedPath} fill="none" stroke="#94a3b8" strokeWidth="2" strokeDasharray="6,4" strokeLinecap="round" />
              )}

              <path d={areaPath} fill="url(#passiveGradient)" />
              <path d={passivePath} fill="none" stroke="#10b981" strokeWidth="3" strokeLinecap="round" />

              <line x1={padding.left} y1={activeIncomeY} x2={width - padding.right} y2={activeIncomeY} stroke="#3b82f6" strokeWidth="2" strokeDasharray="6,4" />
              {!isMobile && (
                <text x={width - padding.right} y={activeIncomeY - 6} textAnchor="end" fontSize={fontSize} fill="#3b82f6" fontWeight="bold">
                  Renda Ativa (Alvo)
                </text>
              )}

              {results.months > 0 && results.months < results.maxMonths && (
                <g>
                  <line x1={crossoverX} y1={padding.top} x2={crossoverX} y2={padding.top + chartHeight} stroke="#f59e0b" strokeWidth="1.5" strokeDasharray="4,4" />
                  <circle cx={crossoverX} cy={activeIncomeY} r="6" fill="#f59e0b" />
                  {!isMobile && (
                    <>
                      <rect x={crossoverX - 55} y={padding.top - 14} width="110" height="22" rx="4" fill="#f59e0b" />
                      <text x={crossoverX} y={padding.top + 1} textAnchor="middle" fontSize={fontSize} fill="white" fontWeight="bold">
                        Independência!
                      </text>
                    </>
                  )}
                </g>
              )}

              {hoverInfo && (() => {
                const tipW = isMobile ? 160 : 190, tipH = isMobile ? 54 : 62;
                const tipFs = isMobile ? 10 : 11;
                const tipX = hoverInfo.svgX + 10 + tipW > width - padding.right ? hoverInfo.svgX - tipW - 10 : hoverInfo.svgX + 10;
                const tipY = Math.max(padding.top, Math.min(hoverInfo.svgY - 30, padding.top + chartHeight - tipH));
                const yr = Math.floor(hoverInfo.month / 12), mo = hoverInfo.month % 12;
                const label = yr > 0 && mo > 0 ? `${yr}a ${mo}m` : yr > 0 ? `${yr} anos` : mo > 0 ? `${mo} meses` : 'Início';
                return (
                  <g>
                    <line x1={hoverInfo.svgX} y1={padding.top} x2={hoverInfo.svgX} y2={padding.top + chartHeight} stroke="#64748b" strokeWidth="1" strokeDasharray="3,3" />
                    <circle cx={hoverInfo.svgX} cy={hoverInfo.svgY} r="4" fill="#10b981" stroke="white" strokeWidth="2" />
                    <rect x={tipX} y={tipY} width={tipW} height={tipH} rx="6" fill="#1e293b" opacity="0.92" />
                    <text x={tipX + 8} y={tipY + 14} fontSize={tipFs} fill="#94a3b8">{label}</text>
                    <text x={tipX + 8} y={tipY + 29} fontSize={tipFs} fill="#34d399" fontWeight="bold">Passiva: {formatCurrencyCompact(hoverInfo.passiveIncome)}</text>
                    <text x={tipX + 8} y={tipY + 44} fontSize={tipFs} fill="#60a5fa">Patrimônio: {formatCurrencyCompact(hoverInfo.patrimony)}</text>
                  </g>
                );
              })()}
            </svg>
          </div>
        );
      };

      return (
        <div className="min-h-screen bg-slate-50 p-4 md:p-8 text-slate-800 font-sans">
          <div className="max-w-5xl mx-auto space-y-6">
            
            <div className="text-center space-y-2 mb-8">
              <h1 className="text-3xl md:text-4xl font-bold text-slate-900 tracking-tight">
                Simulador de Independência Financeira
              </h1>
              <p className="text-slate-600 max-w-2xl mx-auto">
                Descubra em quanto tempo os rendimentos dos seus investimentos (Renda Passiva) 
                vão se igualar ao seu salário atual (Renda Ativa).
              </p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
              
              <div className="lg:col-span-1 bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-6">
                <h2 className="text-lg font-semibold flex items-center gap-2 mb-4">
                  <Target className="w-5 h-5 text-blue-500" />
                  Seus Parâmetros
                </h2>

                <div className="space-y-2">
                  <label className="text-sm font-medium text-slate-700 block">
                    Renda Ativa Mensal (R$)
                  </label>
                  <div className="relative">
                    <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500">R$</span>
                    <input
                      type="number"
                      value={activeIncome || ''}
                      placeholder="0"
                      onChange={(e) => setActiveIncome(e.target.value === '' ? 0 : Math.max(0, Number(e.target.value)))}
                      className="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
                    />
                  </div>
                </div>

                <div className="space-y-2">
                  <label className="text-sm font-medium text-slate-700 block">
                    Patrimônio Inicial (R$)
                  </label>
                  <div className="relative">
                    <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500">R$</span>
                    <input
                      type="number"
                      min="0"
                      value={initialPatrimony || ''}
                      placeholder="0"
                      onChange={(e) => setInitialPatrimony(e.target.value === '' ? 0 : Math.max(0, Number(e.target.value)))}
                      className="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors"
                    />
                  </div>
                  {initialPatrimony > 0 && (
                    <p className="text-xs text-emerald-700">
                      Rende {formatCurrency(initialPatrimony * (Math.pow(1 + ((1 + cdiRate / 100) / (1 + inflationRate / 100) - 1), 1 / 12) - 1))} /mês já no início.
                    </p>
                  )}
                </div>

                <div className="space-y-3 bg-blue-50/50 p-4 rounded-xl border border-blue-100">
                  <div className="flex justify-between items-center">
                    <label className="text-sm font-semibold text-blue-900">
                      Taxa de Poupança (% guardado)
                    </label>
                    <span className="text-lg font-bold text-blue-600">{savingsRate}%</span>
                  </div>
                  <div className="flex gap-1.5">
                    {[10, 20, 30, 50, 70].map(p => (
                      <button
                        key={p}
                        onClick={() => setSavingsRate(p)}
                        className={`flex-1 py-1 text-xs font-semibold rounded-md border transition-colors ${
                          savingsRate === p
                            ? 'bg-blue-600 text-white border-blue-600'
                            : 'bg-white text-blue-700 border-blue-200 hover:bg-blue-100'
                        }`}
                      >
                        {p}%
                      </button>
                    ))}
                  </div>
                  <input
                    type="range"
                    min="1"
                    max="100"
                    value={savingsRate}
                    onChange={(e) => setSavingsRate(Number(e.target.value))}
                    className="w-full h-2 bg-blue-200 rounded-lg appearance-none cursor-pointer accent-blue-600"
                  />
                  <p className="text-xs text-blue-700 text-right">
                    Você guarda {formatCurrency(activeIncome * (savingsRate/100))} por mês.
                  </p>
                </div>

                {/* Status da conexão com BCB */}
                <div className={`flex items-center justify-between p-3 rounded-lg border ${
                  dataStatus === 'live' ? 'bg-emerald-50 border-emerald-200' :
                  dataStatus === 'loading' ? 'bg-amber-50 border-amber-200' :
                  'bg-red-50 border-red-200'
                }`}>
                  <div className="flex items-center gap-2">
                    {dataStatus === 'live' ? (
                      <Wifi className="w-4 h-4 text-emerald-600" />
                    ) : dataStatus === 'loading' ? (
                      <Refresh className="w-4 h-4 text-amber-600 animate-spin" />
                    ) : (
                      <WifiOff className="w-4 h-4 text-red-500" />
                    )}
                    <span className={`text-xs font-medium ${
                      dataStatus === 'live' ? 'text-emerald-700' :
                      dataStatus === 'loading' ? 'text-amber-700' :
                      'text-red-600'
                    }`}>
                      {dataStatus === 'live' ? 'Dados ao vivo — Banco Central' :
                       dataStatus === 'loading' ? 'Buscando dados do BCB...' :
                       'Offline — usando valores manuais'}
                    </span>
                  </div>
                  {dataStatus !== 'loading' && (
                    <button
                      onClick={loadLiveData}
                      className="p-1 rounded hover:bg-white/50 transition-colors"
                      title="Atualizar dados"
                    >
                      <Refresh className="w-3.5 h-3.5 text-slate-500" />
                    </button>
                  )}
                </div>

                <div className="grid grid-cols-2 gap-4">
                  {[
                    { label: 'CDI / SELIC (% a.a.)', value: cdiRate, onChange: handleCdiChange, isManual: isManualCdi, field: 'cdi', liveValue: liveData?.cdi, liveDate: liveData?.cdiDate },
                    { label: 'IPCA 12m (% a.a.)', value: inflationRate, onChange: handleInflationChange, isManual: isManualIpca, field: 'ipca', liveValue: liveData?.ipca, liveDate: liveData?.ipcaDate },
                  ].map(({ label, value, onChange, isManual, field, liveValue, liveDate }) => (
                    <div key={field} className="flex flex-col">
                      <label className="text-sm font-medium text-slate-700 text-center mb-2 min-h-[40px] flex items-center justify-center">
                        {label}
                      </label>
                      <div className="relative">
                        <input
                          type="number"
                          step="0.1"
                          value={value}
                          onChange={(e) => onChange(Number(e.target.value))}
                          className={`w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 text-center ${
                            isManual ? 'bg-amber-50 border-amber-300' : 'bg-slate-50 border-slate-300'
                          }`}
                        />
                        {isManual && liveData && (
                          <button
                            onClick={() => resetToLive(field)}
                            className="absolute right-1 top-1/2 -translate-y-1/2 text-xs text-blue-600 hover:text-blue-800 bg-white px-1.5 py-0.5 rounded border border-blue-200"
                            title={`Restaurar valor ao vivo: ${liveValue}%`}
                          >
                            Ao vivo
                          </button>
                        )}
                      </div>
                      <div className="h-4 mt-1">
                        {liveData && !isManual && (
                          <p className="text-[10px] text-emerald-600 text-center">
                            Ref: {formatDate(liveDate)}
                          </p>
                        )}
                        {isManual && (
                          <p className="text-[10px] text-amber-600 text-center">Valor manual</p>
                        )}
                      </div>
                    </div>
                  ))}
                </div>

                <div className="bg-slate-50 p-3 rounded-lg flex gap-2 items-start">
                  <Info className="w-4 h-4 text-slate-500 mt-0.5 shrink-0" />
                  <p className="text-xs text-slate-600">
                    Os dados de <strong>SELIC</strong> (proxy do CDI) e <strong>IPCA</strong> são carregados em tempo real da API pública do <strong>Banco Central do Brasil</strong> (SGS). O cálculo usa a <strong>Taxa Real</strong> (CDI descontado da Inflação) para garantir que sua renda passiva mantenha o poder de compra.
                  </p>
                </div>
              </div>

              <div className="lg:col-span-2 space-y-6">
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                  <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 flex items-center gap-3">
                    <div className="p-3 bg-emerald-100 rounded-full text-emerald-600 shrink-0">
                      <Clock className="w-7 h-7" />
                    </div>
                    <div className="min-w-0 overflow-hidden">
                      <p className="text-xs font-medium text-slate-500 uppercase tracking-wider" title="Tempo Necessário">Tempo Necessário</p>
                      {results.isPossible ? (
                        <div className="text-lg sm:text-xl font-bold text-slate-800 leading-tight">
                          {results.years > 0 && <span>{results.years}a</span>}
                          {results.years > 0 && results.remainingMonths > 0 && <span> </span>}
                          {results.remainingMonths > 0 && <span>{results.remainingMonths}m</span>}
                          {results.years === 0 && results.remainingMonths === 0 && <span>Imediato</span>}
                        </div>
                      ) : (
                        <div className="text-sm font-bold text-red-500 break-words">
                          {results.error || "Mais de 150 anos"}
                        </div>
                      )}
                      {pinnedScenario && results.isPossible && (() => {
                        const diff = results.months - pinnedScenario.months;
                        const absDiffYr = Math.floor(Math.abs(diff) / 12);
                        const absDiffMo = Math.abs(diff) % 12;
                        const label = absDiffYr > 0 && absDiffMo > 0 ? `${absDiffYr}a ${absDiffMo}m` : absDiffYr > 0 ? `${absDiffYr}a` : `${absDiffMo}m`;
                        return (
                          <div className={`text-xs font-semibold mt-0.5 truncate ${diff < 0 ? 'text-emerald-600' : diff > 0 ? 'text-red-500' : 'text-slate-400'}`}>
                            {diff < 0 ? `▼ ${label} mais rápido` : diff > 0 ? `▲ ${label} mais lento` : '= igual ao fixado'}
                          </div>
                        );
                      })()}
                    </div>
                  </div>

                  <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 flex items-center gap-3">
                    <div className="p-3 bg-blue-100 rounded-full text-blue-600 shrink-0">
                      <TrendingUp className="w-7 h-7" />
                    </div>
                    <div className="min-w-0 overflow-hidden">
                      <p className="text-xs font-medium text-slate-500 uppercase tracking-wider" title="Patrimônio Alvo">Patrimônio Alvo</p>
                      <div
                        className="text-lg sm:text-xl font-bold text-slate-800 leading-tight truncate"
                        title={results.isPossible ? formatCurrency(results.finalPatrimony) : undefined}
                      >
                        {results.isPossible ? formatCurrencyCompact(results.finalPatrimony) : "---"}
                      </div>
                      {results.isPossible && (
                        <p className="text-[10px] text-slate-400 truncate" title={formatCurrency(results.finalPatrimony)}>
                          {formatCurrency(results.finalPatrimony)}
                        </p>
                      )}
                    </div>
                  </div>

                  <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 flex items-center gap-3">
                    <div className="p-3 bg-amber-100 rounded-full text-amber-600 shrink-0">
                      <Target className="w-7 h-7" />
                    </div>
                    <div className="min-w-0 overflow-hidden">
                      <p className="text-xs font-medium text-slate-500 uppercase tracking-wider" title="Taxa Real Anual">Taxa Real Anual</p>
                      <div className="text-lg sm:text-xl font-bold text-slate-800 leading-tight">
                        {results.isPossible ? `${results.realAnnualRate.toFixed(2)}%` : "---"}
                      </div>
                      <p className="text-[10px] text-slate-400">CDI descontado da inflação</p>
                    </div>
                  </div>
                </div>

                <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200" ref={chartContainerRef}>
                  <div className="flex items-center justify-between mb-4">
                    <h3 className="text-lg font-semibold text-slate-800">Evolução da Renda Passiva Mensal</h3>
                    <div className="flex items-center gap-2">
                      {pinnedScenario && (
                        <div className="flex items-center gap-1.5 text-xs text-slate-500">
                          <span className="inline-block w-6 h-0.5 bg-slate-400" style={{borderTop: '2px dashed #94a3b8'}}></span>
                          <span>Cenário fixado ({pinnedScenario.savingsRate}% poupança)</span>
                        </div>
                      )}
                      <button
                        onClick={() => {
                          if (pinnedScenario) {
                            setPinnedScenario(null);
                          } else if (results.isPossible) {
                            setPinnedScenario({
                              savingsRate,
                              cdiRate,
                              inflationRate,
                              months: results.months,
                              maxMonths: results.maxMonths,
                              data: results.data,
                            });
                          }
                        }}
                        disabled={!results.isPossible && !pinnedScenario}
                        className={`text-xs px-3 py-1.5 rounded-lg border font-medium transition-colors ${
                          pinnedScenario
                            ? 'bg-slate-100 text-slate-600 border-slate-300 hover:bg-red-50 hover:text-red-600 hover:border-red-300'
                            : 'bg-white text-slate-600 border-slate-300 hover:bg-slate-50'
                        } disabled:opacity-40 disabled:cursor-not-allowed`}
                      >
                        {pinnedScenario ? '✕ Liberar cenário' : '📌 Fixar cenário'}
                      </button>
                    </div>
                  </div>
                  {renderChart()}
                  {results.isPossible && results.data.length > 0 && (() => {
                    const yearMap = {};
                    results.data.forEach(d => {
                      const yr = Math.floor(d.month / 12);
                      yearMap[yr] = d;
                    });
                    const rows = Object.entries(yearMap)
                      .map(([yr, d]) => ({ year: Number(yr), ...d }))
                      .filter(r => r.year > 0)
                      .sort((a, b) => a.year - b.year);
                    const independenceYear = Math.floor(results.months / 12);
                    return (
                      <details className="mt-4">
                        <summary className="text-sm text-slate-500 cursor-pointer hover:text-slate-700 select-none py-1">
                          Ver tabela de evolução anual
                        </summary>
                        <div className="mt-3 overflow-x-auto">
                          <table className="w-full text-sm border-collapse">
                            <thead>
                              <tr className="text-xs text-slate-500 uppercase tracking-wider border-b border-slate-200">
                                <th className="text-left py-2 pr-4 font-medium">Ano</th>
                                <th className="text-right py-2 pr-4 font-medium">Patrimônio</th>
                                <th className="text-right py-2 pr-4 font-medium">Renda Passiva</th>
                                <th className="text-right py-2 font-medium">% da Meta</th>
                              </tr>
                            </thead>
                            <tbody>
                              {rows.map(r => {
                                const pct = (r.passiveIncome / activeIncome) * 100;
                                const isIndep = r.year === independenceYear;
                                return (
                                  <tr key={r.year} className={`border-b border-slate-100 ${isIndep ? 'bg-emerald-50' : 'hover:bg-slate-50'}`}>
                                    <td className={`py-2 pr-4 font-medium ${isIndep ? 'text-emerald-700' : 'text-slate-700'}`}>
                                      {r.year}{isIndep ? ' 🎯' : ''}
                                    </td>
                                    <td className="py-2 pr-4 text-right text-slate-600">{formatCurrency(r.patrimony || 0)}</td>
                                    <td className={`py-2 pr-4 text-right font-medium ${isIndep ? 'text-emerald-700' : 'text-slate-700'}`}>{formatCurrency(r.passiveIncome)}</td>
                                    <td className="py-2 text-right">
                                      <span className={`text-xs font-semibold px-2 py-0.5 rounded-full ${pct >= 100 ? 'bg-emerald-100 text-emerald-700' : pct >= 50 ? 'bg-blue-100 text-blue-700' : 'bg-slate-100 text-slate-600'}`}>
                                        {pct.toFixed(0)}%
                                      </span>
                                    </td>
                                  </tr>
                                );
                              })}
                            </tbody>
                          </table>
                        </div>
                      </details>
                    );
                  })()}
                </div>
              </div>
            </div>

            {/* Seção explicativa reformulada */}
            <div className="bg-white rounded-2xl p-8 shadow-sm border border-slate-200 space-y-10">
              <div className="text-center space-y-3">
                <h2 className="text-2xl font-bold text-slate-900">Como entender este simulador?</h2>
                <p className="text-slate-500 text-base max-w-2xl mx-auto">
                  Este não é apenas um gráfico de números, é o mapa para a sua liberdade de escolha.
                </p>
              </div>

              {/* Guia de Uso */}
              <div className="grid grid-cols-1 md:grid-cols-2 gap-6 items-start">
                <div>
                  <h3 className="text-sm font-bold text-slate-700 uppercase tracking-wider mb-3">Como usar em 4 passos</h3>
                  <ol className="space-y-2.5">
                    {[
                      { label: "Defina o alvo", desc: "Informe sua renda ativa mensal — quanto ganha hoje ou quanto quer receber no futuro." },
                      { label: "Ajuste a poupança", desc: "Defina a taxa de poupança. Quanto maior, mais rápido o gráfico sobe." },
                      { label: "Adicione o que já tem", desc: "Coloque seu patrimônio inicial investido. Mesmo um valor pequeno acelera bastante." },
                      { label: "Observe o cruzamento", desc: "O ponto amarelo no gráfico é o seu dia da independência financeira." },
                    ].map((item, i) => (
                      <li key={i} className="flex items-start gap-3">
                        <span className="flex-shrink-0 w-5 h-5 rounded-full bg-blue-100 text-blue-600 text-xs font-bold flex items-center justify-center mt-0.5">{i + 1}</span>
                        <p className="text-sm text-slate-600 leading-snug"><strong className="text-slate-800 font-semibold">{item.label}:</strong> {item.desc}</p>
                      </li>
                    ))}
                  </ol>
                </div>

                <div className="bg-slate-50 rounded-xl p-5 border border-slate-100">
                  <h3 className="text-sm font-bold text-slate-700 uppercase tracking-wider mb-3 flex items-center gap-1.5">
                    <Info className="w-3.5 h-3.5 text-blue-500" />
                    Dicionário rápido
                  </h3>
                  <div className="space-y-3">
                    {[
                      { color: "text-blue-600", label: "Renda Ativa", desc: "Depende do seu tempo — salário, freela. Se você parar, ela para." },
                      { color: "text-emerald-600", label: "Renda Passiva", desc: "Gerada pelo seu patrimônio (juros). Cai na conta enquanto você dorme." },
                      { color: "text-amber-600", label: "Taxa Real", desc: "Rendimento acima da inflação. É o que de fato aumenta seu poder de compra." },
                    ].map((item, i) => (
                      <div key={i} className="flex items-start gap-2.5">
                        <span className={`text-xs font-bold uppercase tracking-wide ${item.color} w-24 flex-shrink-0 pt-0.5`}>{item.label}</span>
                        <p className="text-sm text-slate-600 leading-snug">{item.desc}</p>
                      </div>
                    ))}
                  </div>
                </div>
              </div>

              {/* O Segredo da Taxa de Poupança */}
              <div className="border-t border-slate-100 pt-8">
                <div className="bg-amber-50 rounded-2xl p-6 md:p-8 border border-amber-100 relative overflow-hidden">
                  <div className="absolute top-0 right-0 p-4 opacity-10">
                    <Target className="w-24 h-24 text-amber-900" />
                  </div>
                  
                  <div className="relative z-10 space-y-4">
                    <h3 className="text-lg font-bold text-amber-900 flex items-center gap-2">
                      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-5 h-5">
                        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                      </svg>
                      O conceito mais importante (e surpreendente)
                    </h3>
                    
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                      <p className="text-amber-900/80 text-sm leading-relaxed">
                        Se você começar do zero, o tempo para sua independência <strong className="text-amber-900">não depende de quanto você ganha</strong>, mas sim de <strong className="text-amber-900">qual porcentagem</strong> do seu salário você guarda.
                      </p>
                      <p className="text-amber-900/80 text-sm leading-relaxed">
                        Quem ganha R$ 5.000 e guarda 20% chegará à liberdade no <strong>mesmo dia</strong> que alguém que ganha R$ 50.000 e guarda os mesmos 20%. 
                      </p>
                    </div>

                    <div className="bg-white/50 rounded-lg p-4 mt-2">
                      <p className="text-amber-900 text-sm italic">
                        <strong>Por que?</strong> Porque quanto mais você ganha, maior tende a ser seu custo de vida (sua meta). O alvo cresce na mesma proporção que sua capacidade de poupar. O único jeito de "cortar caminho" é aumentando sua <strong>Taxa de Poupança</strong> ou já começando com um <strong>Patrimônio Inicial</strong>.
                      </p>
                    </div>
                    
                    <div className="pt-2">
                      <p className="text-xs text-amber-800 font-medium">
                        💡 Teste no simulador: Mude sua renda para o dobro e veja que o tempo não muda. Depois, mude sua taxa de poupança de 10% para 20% e veja os anos despencarem!
                      </p>
                    </div>
                  </div>
                </div>
              </div>
            </div>

          </div>
        </div>
      );
    }

    // Renderiza a aplicação
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
